name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check src tests
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      - run: pip install ".[dev]"
      # The NameError-at-import class of bug (ast.parse misses these): import every
      # module and load every tool, not just parse them.
      - name: Import smoke test
        env:
          LLM_BASE_URL: http://ci.invalid
          LLM_API_KEY: ci
          LLM_MODEL: ci
          ARIA_ENV: /dev/null
        run: |
          python - <<'PY'
          import importlib, pkgutil
          import aria, aria.tools
          for m in pkgutil.iter_modules(aria.__path__):
              importlib.import_module(f"aria.{m.name}")
          print(len(aria.tools.load_all()), "tools loaded; all modules import OK")
          PY
      - run: pytest -q

  whatsapp-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check whatsapp/bridge.js
